<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" fill="none">
  <defs>
    <linearGradient id="eqFavBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#141d2e" />
      <stop offset="50%" stopColor="#0d1424" />
      <stop offset="100%" stopColor="#070b14" />
    </linearGradient>
    <linearGradient id="eqFavBar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stopColor="#00F59B" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#00F59B" stopOpacity="0.75" />
    </linearGradient>
    <linearGradient id="eqFavBar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stopColor="#00F59B" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#00F59B" stopOpacity="0.9" />
    </linearGradient>
    <linearGradient id="eqFavBar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stopColor="#00F59B" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#00F59B" />
    </linearGradient>
    <linearGradient id="eqFavBar4" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stopColor="#00F59B" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>
    <linearGradient id="eqFavLine" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stopColor="#00F59B" />
      <stop offset="70%" stopColor="#00F59B" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="0.5" y="0.5" width="37" height="37" rx="9" fill="url(#eqFavBg)" stroke="#00F59B" stroke-opacity="0.35" stroke-width="1" />

  <!-- 4 Quantitative Bars -->
  <rect x="5.5" y="21" width="4.2" height="10" rx="1.5" fill="url(#eqFavBar1)" />
  <rect x="12.5" y="16" width="4.2" height="15" rx="1.5" fill="url(#eqFavBar2)" />
  <rect x="19.5" y="11" width="4.2" height="20" rx="1.5" fill="url(#eqFavBar3)" />
  <rect x="26.5" y="6" width="4.2" height="25" rx="1.5" fill="url(#eqFavBar4)" />

  <!-- Breakout Trajectory -->
  <path d="M 4.5 25 C 11.5 23.5, 18.5 16, 31.5 7" stroke="url(#eqFavLine)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 24 7 H 31.5 V 14.5" stroke="#00F59B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>