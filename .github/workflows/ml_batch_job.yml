name: Daily ML Batch Inference & Sync

on:
  schedule:
    # Runs Monday through Friday at 22:00 UTC (6:00 PM EDT, post-market close)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  batch-inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install scikit-learn joblib tensorflow

      - name: Run ML Batch Inference & DB Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python ml_pipeline/batch_inference.py --tickers AAPL MSFT NVDA TSLA AMZN
