services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: equitix-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/postgres}
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_change_in_production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:80","http://localhost"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - equitix-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: equitix-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - equitix-net

networks:
  equitix-net:
    driver: bridge
